name: Publish QuickOrbit website
on:
  push:
    branches: [main]
    paths:
      - 'quickorbit-pages.part-*'
      - 'quickorbit-overlay.part-*'
      - '.github/workflows/quickorbit-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and unpack prepared website
        run: |
          cat quickorbit-pages.part-aa quickorbit-pages.part-ab quickorbit-pages.part-ac quickorbit-pages.part-ad > quickorbit-pages.zip
          unzip -q quickorbit-pages.zip -d website
      - name: Apply the latest website refinements
        run: |
          cat quickorbit-overlay.part-* > quickorbit-overlay.zip
          unzip -oq quickorbit-overlay.zip -d website
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - uses: actions/deploy-pages@v4
        id: deployment
